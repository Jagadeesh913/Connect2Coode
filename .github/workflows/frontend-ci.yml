name: Frontend CI

on:
  push:
    branches:
      - main
      - "phase/**"
      - "ci/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, typecheck, build, and preview smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Architecture verification
        run: npm run verify:architecture

      - name: Documentation verification
        run: npm run verify:docs

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Run automated test suites
        run: npm test

      - name: Typecheck
        run: npx --yes -p typescript@5.9.3 tsc -p tsconfig.json --noEmit

      - name: Build
        run: npm run build

      - name: Preview smoke test
        run: node scripts/smoke-preview.mjs
