name: Frontend CI

on:
  push:
    branches:
      - main
      - "phase/**"
      - "ci/**"
      - "modernization/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, typecheck, unit, e2e, build, and smoke verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Lint (ESLint + TypeScript ESLint)
        run: npm run lint:eslint

      - name: Architecture & Dependency Cruising
        run: |
          npm run verify:architecture
          npm run depcruise

      - name: Documentation verification
        run: npm run verify:docs

      - name: Vitest unit and component tests
        run: npm run test:unit

      - name: Node test runner regression suites
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e

      - name: Preview smoke test
        run: node scripts/smoke-preview.mjs
